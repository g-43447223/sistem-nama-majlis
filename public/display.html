<!doctype html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Paparan Majlis</title>
    <meta name="theme-color" content="#050c17" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/display.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b1b33'/%3E%3Cpath d='M16 6l2.6 6.3H25l-5.2 4.1 2 6.6-5.8-3.8-5.8 3.8 2-6.6L7 10.3h6.4z' fill='%23d8b45f'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="bg is-empty" id="bg"></div>
      <div class="grain"></div>
      <div class="rings"></div>

      <header class="top">
        <div class="brand-display">
          <span class="crest" id="crest">
            <img id="crestLogo" alt="Logo sekolah" />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
              <path d="M12 3l2.2 5.1 5.5.5-4.2 3.7 1.3 5.4L12 14.8 7.2 17.7l1.3-5.4L4.3 8.6l5.5-.5L12 3z" />
              <path d="M5 20h14" stroke-linecap="round" />
            </svg>
          </span>
          <div class="brand-text" id="brandText">
            <b id="namaSekolah">Sekolah Kebangsaan Pulau Indah 2</b>
            <i id="capPenjuru"></i>
          </div>
        </div>

        <div class="event-title">
          <b id="tajukMajlis">Majlis Apresiasi Murid Cemerlang</b>
          <span id="subtajukMajlis">Sesi 2026</span>
        </div>

        <div class="clock">
          <b id="jam">00:00:00</b>
          <span id="tarikh">06 NOVEMBER 2026</span>
        </div>
      </header>

      <main class="center">
        <section class="idle" id="idle">
          <div class="idle-logo">
            <img class="idle-logo-img" id="idleLogo" alt="Logo majlis" />
            <svg class="idle-logo-crest" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
              <path d="M12 3l2.2 5.1 5.5.5-4.2 3.7 1.3 5.4L12 14.8 7.2 17.7l1.3-5.4L4.3 8.6l5.5-.5L12 3z" />
              <path d="M5 20h14" stroke-linecap="round" />
            </svg>
          </div>
          <p class="idle-eyebrow">Selamat Datang</p>
          <span class="waiting"><i></i> Menunggu imbasan</span>
        </section>

        <section class="reveal" id="reveal" aria-live="polite">
          <div class="photo-wrap">
            <img class="photo" id="foto" alt="Gambar murid" />
          </div>
          <p class="reveal-eyebrow" id="eyebrow">Tahniah</p>
          <h1 class="name" id="nama">Nama Murid</h1>
          <div class="name-rule"></div>
          <span class="kelas" id="kelas">Kelas</span>
        </section>
      </main>

      <div class="demo-badge hidden" id="demoBadge">Mod Demo</div>

      <button class="sound-btn" id="soundBtn" type="button" title="Aktifkan bunyi sambutan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M11 5L6 9H3v6h3l5 4V5z" />
          <path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13" />
        </svg>
        Aktifkan bunyi
      </button>

      <footer class="bottom">
        <div class="attendance" id="attendanceBox">
          <b>Kehadiran</b>
          <div class="num"><span id="hadir">0</span><small>/ <span id="total">0</span> murid</small></div>
          <div class="bar"><i id="barFill"></i></div>
        </div>

        <div class="footer-note">
          <div id="footerTajuk">Majlis Apresiasi Murid Cemerlang</div>
          <div class="queue-badge" id="queueBadge">0 menunggu</div>
        </div>
      </footer>

      <canvas id="confetti"></canvas>
      <div class="conn" id="conn"><i></i> Sambungan terputus — cuba semula</div>
    </div>

    <script src="/js/util.js"></script>
    <script src="/js/display.js"></script>
  </body>
</html>
